<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="900" height="580" rx="14" fill="#fbfbfd" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#111827">Rescatar un archivo heredado: tres actos y tres puertas</text>
  <text x="32" y="70" font-size="14" fill="#4b5563">Entender, documentar y proponer. Las puertas rojas son los puntos donde la IA no decide: decides tú.</text>

  <rect x="32" y="94" width="270" height="40" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="167" y="120" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">Acto 1 · Excel: entender</text>
  <rect x="315" y="94" width="270" height="40" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="450" y="120" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">Acto 2 · Word: documentar</text>
  <rect x="598" y="94" width="270" height="40" rx="8" fill="#ffedd5" stroke="#fb923c" stroke-width="1.5"/>
  <text x="733" y="120" font-size="15" font-weight="700" fill="#9a3412" text-anchor="middle">Acto 3 · PowerPoint: proponer</text>

  <rect x="32" y="146" width="270" height="222" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
  <circle cx="58" cy="176" r="12" fill="#16a34a"/><text x="58" y="181" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
  <text x="78" y="181" font-size="13" fill="#14532d" font-weight="600">Inventario del libro</text>
  <text x="78" y="199" font-size="11.5" fill="#4b5563">qué hoja hace qué</text>
  <circle cx="58" cy="228" r="12" fill="#16a34a"/><text x="58" y="233" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
  <text x="78" y="233" font-size="13" fill="#14532d" font-weight="600">Traducir las fórmulas</text>
  <text x="78" y="251" font-size="11.5" fill="#4b5563">y sus supuestos ocultos</text>
  <circle cx="58" cy="280" r="12" fill="#16a34a"/><text x="58" y="285" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
  <text x="78" y="285" font-size="13" fill="#14532d" font-weight="600">Diagnóstico de calidad</text>
  <text x="78" y="303" font-size="11.5" fill="#4b5563">vacíos, duplicados, atípicos</text>
  <circle cx="58" cy="332" r="12" fill="#16a34a"/><text x="58" y="337" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
  <text x="78" y="337" font-size="13" fill="#14532d" font-weight="600">Plan de limpieza</text>
  <text x="78" y="355" font-size="11.5" fill="#4b5563">propuesto, no aplicado</text>

  <rect x="315" y="146" width="270" height="222" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <circle cx="341" cy="176" r="12" fill="#2563eb"/><text x="341" y="181" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">5</text>
  <text x="361" y="181" font-size="13" fill="#1e3a8a" font-weight="600">Documento de traspaso</text>
  <text x="361" y="199" font-size="11.5" fill="#4b5563">qué hace, de dónde viene,</text>
  <text x="361" y="215" font-size="11.5" fill="#4b5563">qué romperlo significa</text>
  <circle cx="341" cy="248" r="12" fill="#2563eb"/><text x="341" y="253" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">6</text>
  <text x="361" y="253" font-size="13" fill="#1e3a8a" font-weight="600">Hoja LÉEME</text>
  <text x="361" y="271" font-size="11.5" fill="#4b5563">la versión corta, dentro</text>
  <text x="361" y="287" font-size="11.5" fill="#4b5563">del propio libro</text>
  <circle cx="341" cy="320" r="12" fill="#2563eb"/><text x="341" y="325" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">7</text>
  <text x="361" y="325" font-size="13" fill="#1e3a8a" font-weight="600">Bitácora de cambios</text>
  <text x="361" y="343" font-size="11.5" fill="#4b5563">qué tocaste y por qué</text>

  <rect x="598" y="146" width="270" height="222" rx="10" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
  <circle cx="624" cy="176" r="12" fill="#ea580c"/><text x="624" y="181" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">8</text>
  <text x="644" y="181" font-size="13" fill="#9a3412" font-weight="600">Diagnóstico en 5 láminas</text>
  <text x="644" y="199" font-size="11.5" fill="#4b5563">para quien es dueño</text>
  <text x="644" y="215" font-size="11.5" fill="#4b5563">del proceso</text>
  <circle cx="624" cy="248" r="12" fill="#ea580c"/><text x="624" y="253" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">9</text>
  <text x="644" y="253" font-size="13" fill="#9a3412" font-weight="600">Riesgo si no se hace nada</text>
  <text x="644" y="271" font-size="11.5" fill="#4b5563">el argumento que sí mueve</text>
  <text x="644" y="287" font-size="11.5" fill="#4b5563">presupuesto</text>
  <circle cx="624" cy="320" r="12" fill="#ea580c"/><text x="624" y="325" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">10</text>
  <text x="644" y="325" font-size="13" fill="#9a3412" font-weight="600">La decisión que pides</text>
  <text x="644" y="343" font-size="11.5" fill="#4b5563">una sola, concreta</text>

  <text x="32" y="398" font-size="13" font-weight="700" fill="#991b1b">LAS TRES PUERTAS · sin pasarlas, no se avanza</text>

  <rect x="32" y="410" width="270" height="118" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="52" y="438" font-size="13" font-weight="700" fill="#991b1b">Puerta 1 — tras el paso 2</text>
  <text x="52" y="462" font-size="12" fill="#7f1d1d">¿La explicación coincide con lo</text>
  <text x="52" y="480" font-size="12" fill="#7f1d1d">que hace la fórmula en un caso</text>
  <text x="52" y="498" font-size="12" fill="#7f1d1d">real que ya conoces?</text>
  <text x="52" y="518" font-size="11.5" fill="#b91c1c" font-style="italic">Si no, la documentación miente.</text>

  <rect x="315" y="410" width="270" height="118" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="335" y="438" font-size="13" font-weight="700" fill="#991b1b">Puerta 2 — antes del paso 5</text>
  <text x="335" y="462" font-size="12" fill="#7f1d1d">¿Los totales de control dan</text>
  <text x="335" y="480" font-size="12" fill="#7f1d1d">exactamente igual antes y</text>
  <text x="335" y="498" font-size="12" fill="#7f1d1d">después de cada cambio?</text>
  <text x="335" y="518" font-size="11.5" fill="#b91c1c" font-style="italic">Si no, revierte ese paso.</text>

  <rect x="598" y="410" width="270" height="118" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="618" y="438" font-size="13" font-weight="700" fill="#991b1b">Puerta 3 — antes de entregar</text>
  <text x="618" y="462" font-size="12" fill="#7f1d1d">¿Alguien que nunca vio el</text>
  <text x="618" y="480" font-size="12" fill="#7f1d1d">archivo puede usarlo solo con</text>
  <text x="618" y="498" font-size="12" fill="#7f1d1d">tu documentación?</text>
  <text x="618" y="518" font-size="11.5" fill="#b91c1c" font-style="italic">Pruébalo con una persona real.</text>

  <text x="32" y="556" font-size="11.5" fill="#9ca3af">Copilot traduce, detecta y redacta. Las tres puertas son tuyas: no hay ruta alternativa para ninguna.</text>
</svg>
