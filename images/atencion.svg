<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">
  <rect x="0" y="0" width="900" height="470" rx="14" fill="#fbfbfd" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#111827">La atención: qué partes del texto sí importan</text>
  <text x="32" y="70" font-size="14" fill="#4b5563">En cada predicción el modelo pondera todo lo anterior. No todo pesa igual.</text>

  <g font-size="15" fill="#111827">
    <rect x="40" y="290" width="34" height="34" rx="6" fill="#f3f4f6" stroke="#d1d5db"/><text x="57" y="313" text-anchor="middle">El</text>
    <rect x="82" y="290" width="86" height="34" rx="6" fill="#fee2e2" stroke="#f87171" stroke-width="2"/><text x="125" y="313" text-anchor="middle" font-weight="700" fill="#991b1b">contrato</text>
    <rect x="176" y="290" width="42" height="34" rx="6" fill="#f3f4f6" stroke="#d1d5db"/><text x="197" y="313" text-anchor="middle">que</text>
    <rect x="226" y="290" width="92" height="34" rx="6" fill="#f3f4f6" stroke="#d1d5db"/><text x="272" y="313" text-anchor="middle">firmamos</text>
    <rect x="326" y="290" width="34" height="34" rx="6" fill="#f3f4f6" stroke="#d1d5db"/><text x="343" y="313" text-anchor="middle">en</text>
    <rect x="368" y="290" width="66" height="34" rx="6" fill="#fed7aa" stroke="#fb923c" stroke-width="2"/><text x="401" y="313" text-anchor="middle" font-weight="700" fill="#9a3412">marzo</text>
    <rect x="442" y="290" width="42" height="34" rx="6" fill="#f3f4f6" stroke="#d1d5db"/><text x="463" y="313" text-anchor="middle">con</text>
    <rect x="492" y="290" width="26" height="34" rx="6" fill="#f3f4f6" stroke="#d1d5db"/><text x="505" y="313" text-anchor="middle">el</text>
    <rect x="526" y="290" width="98" height="34" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/><text x="575" y="313" text-anchor="middle" fill="#92400e">proveedor</text>
    <rect x="632" y="290" width="30" height="34" rx="6" fill="#f3f4f6" stroke="#d1d5db"/><text x="647" y="313" text-anchor="middle">de</text>
    <rect x="670" y="290" width="98" height="34" rx="6" fill="#f9fafb" stroke="#e5e7eb"/><text x="719" y="313" text-anchor="middle" fill="#9ca3af">Monterrey</text>
    <rect x="776" y="290" width="70" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="811" y="313" text-anchor="middle" font-weight="700" fill="#1e3a8a">vence</text>
  </g>

  <text x="776" y="352" font-size="12" fill="#1e3a8a" font-weight="700">token actual</text>

  <path d="M805 284 C 700 170, 260 160, 128 284" fill="none" stroke="#dc2626" stroke-width="6" stroke-opacity="0.75"/>
  <path d="M801 284 C 720 200, 470 200, 401 284" fill="none" stroke="#ea580c" stroke-width="3.5" stroke-opacity="0.75"/>
  <path d="M797 284 C 740 234, 620 234, 575 284" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.75"/>
  <path d="M789 284 C 770 258, 740 258, 719 284" fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="120" y="150" font-size="13" fill="#991b1b" font-weight="700">peso alto</text>
  <text x="384" y="188" font-size="13" fill="#9a3412" font-weight="700">medio</text>
  <text x="566" y="224" font-size="12" fill="#92400e">bajo</text>
  <text x="700" y="252" font-size="12" fill="#9ca3af">casi cero</text>

  <rect x="32" y="374" width="836" height="76" rx="9" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="50" y="400" font-size="13.5" fill="#1e3a8a">Para completar <tspan font-style="italic">"vence el..."</tspan>, tu cabeza también le da peso a "contrato" y a "marzo", e ignora "Monterrey".</text>
  <text x="50" y="424" font-size="13.5" fill="#1e3a8a">El modelo hace lo mismo. Ese mecanismo se llama <tspan font-weight="700">atención</tspan> y es el corazón de la arquitectura <tspan font-weight="700">Transformer</tspan></text>
  <text x="50" y="442" font-size="13.5" fill="#1e3a8a">(Google, 2017), el salto técnico que hizo posible todo lo que usas hoy.</text>
</svg>
